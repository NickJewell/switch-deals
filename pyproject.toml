[project]
name = "switch-deals"
version = "0.1.0"
description = "UK Nintendo eShop deals -> narrated weekly video pipeline"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6", "python-dotenv>=1"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
